name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

  contract:
    name: Validate OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Validate openapi.yaml against the 3.1 metaschema
        run: make spec-lint

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Dummy values only. The unit suite mocks GitHub and never leaves the
      # runner, so no real secret is needed — or wanted — here.
      - name: Run tests with coverage gate
        env:
          GITHUB_OWNER: ci-owner
          GITHUB_REPO: ci-repo
          WEBHOOK_SECRET: ci-test-secret-not-a-real-secret
          PORT: "8080"
        run: |
          GITHUB_TOKEN=ci-dummy-token \
          pytest tests/unit -v \
            --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: issues-gw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e GITHUB_TOKEN=ci-dummy-token \
            -e GITHUB_OWNER=ci-owner \
            -e GITHUB_REPO=ci-repo \
            -e WEBHOOK_SECRET=ci-test-secret-not-a-real-secret \
            -e PORT=8080 \
            issues-gw:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Service is up."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Service never became healthy:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          echo "--- /healthz ---"
          curl -fsS http://localhost:8080/healthz

          # An unsigned webhook must be rejected. If this ever returns 204 the
          # security boundary has regressed and the build should fail.
          echo "--- unsigned webhook must be 401 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8080/webhook \
            -H 'X-GitHub-Event: issues' \
            -H 'Content-Type: application/json' \
            -d '{"action":"opened"}')
          test "$code" = "401" || { echo "Expected 401, got $code"; exit 1; }

          docker rm -f smoke

  # Live GitHub tests. Skipped on forks, where secrets are unavailable.
  integration:
    name: Integration (live GitHub)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.repository == github.event.repository.full_name
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Start the service
        env:
          # GITHUB_TOKEN is reserved by Actions: the runner injects its own
          # value and it cannot be overridden here. Pass ours under a
          # different name and export it in the shell instead.
          GW_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
          GITHUB_OWNER: ${{ vars.GH_ISSUES_OWNER }}
          GITHUB_REPO: ${{ vars.GH_ISSUES_REPO }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PORT: "8080"
        run: |
          test -n "$GW_TOKEN" || { echo "GH_ISSUES_TOKEN secret is empty"; exit 1; }
          echo "token length: ${#GW_TOKEN}, owner: $GITHUB_OWNER, repo: $GITHUB_REPO"
          export GITHUB_TOKEN="$GW_TOKEN"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 \
            > service.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run integration tests
        env:
          RUN_INTEGRATION: "1"
          BASE_URL: http://127.0.0.1:8080
        run: pytest tests/integration -v

      - name: Service logs on failure
        if: failure()
        run: cat service.log
